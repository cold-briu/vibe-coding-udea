    .text-slate-900 { color: #0f172a; }

    .hover\:text-blue-600:hover { color: #2563eb; }

    .transition-colors { transition-property: color, background-color, border-color, text-decoration-color, fill, stroke; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }

<body class="bg-slate-50 text-slate-900 font-mono min-h-screen flex flex-col antialiased">

  <!-- LIST OF CARDS SECTION -->
  <main class="w-full max-w-[1100px] mx-auto px-6 py-12 flex-grow" id="bitacora">
    <div class="flex flex-col gap-7 w-full" id="cards-container">
      <!-- Dynamically populated via JavaScript from bitacora.json -->
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-white py-7 mt-auto border-t border-slate-200">
    <div class="w-full max-w-[1100px] mx-auto px-6 flex items-center justify-between text-xs text-slate-500 flex-wrap gap-4">
      <p>&copy; 2026 Semillero Vibe Coding UdeA. <a href="LICENSE" target="_blank" rel="noopener" class="text-slate-600 underline hover:text-blue-600">Licencia MIT</a>.</p>
      <div>
        <a href="https://github.com/cold-briu/vibe-coding-udea" target="_blank" rel="noopener" class="text-slate-600 underline hover:text-blue-600">GitHub</a>
      </div>
    </div>
  </footer>

  <!-- Script to Render bitacora.json Cards -->
  <script>
    function formatDate(dateStr) {
      if (!dateStr || typeof dateStr !== 'string') return '';
      const parts = dateStr.trim().split('-');
      if (parts.length !== 3) return dateStr;
      const year = parseInt(parts[0], 10);
      const month = parseInt(parts[1], 10) - 1;
      const day = parseInt(parts[2], 10);
      if (isNaN(year) || isNaN(month) || isNaN(day)) return dateStr;
      
      const months = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
      const monthName = months[month];
      
      return `${monthName} ${day} de ${year}`;
    }

    function parseMarkdown(str) {
      if (typeof str !== 'string') return '';
      return str
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code class="bg-slate-100 px-1.5 py-0.5 text-[0.85em] text-slate-900 font-mono rounded-none">$1</code>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener" class="text-blue-600 underline hover:text-blue-800">$1</a>');
    }

    function renderListItems(items, isNested = false) {
      if (!Array.isArray(items) || items.length === 0) return '';
      const listClasses = isNested
        ? 'list-[circle] pl-4 mt-1.5 mb-1 flex flex-col gap-2'
        : 'list-disc pl-5 flex flex-col gap-2 text-[0.925rem] text-slate-600 leading-relaxed';

      let html = `<ul class="${listClasses}">`;
      for (const item of items) {
        if (typeof item === 'string') {
          html += `<li>${parseMarkdown(item)}</li>`;
        } else if (Array.isArray(item)) {
          const [title, children] = item;
          html += `<li>${parseMarkdown(title)}${renderListItems(children, true)}</li>`;
        }
      }
      html += '</ul>';
      return html;
    }

    function renderCards(data) {
      const container = document.getElementById('cards-container');
      if (!container) return;
      
      const sessions = Array.isArray(data)
        ? data
        : Object.entries(data).map(([key, val]) => ({
            title: key,
            video: val?.video || null,
            items: val?.items || val
          }));

      let html = '';
      for (const item of sessions) {
        const sessionBadge = item.session
          ? `<span class="inline-block px-2 py-0.5 text-xs font-semibold bg-blue-50 text-blue-600 border border-blue-200 rounded-none flex-shrink-0">Sesión ${item.session}</span>`
          : '';

        const dateSpan = item.date
          ? `<span class="text-xs text-slate-500 font-normal flex-shrink-0">${formatDate(item.date)}</span>`
          : '';

        const titleText = item.title || item.rawTitle || item.headerTitle || '';
        const videoUrl = item.video || null;
        const sessionItems = item.items || [];

        const videoBtnHtml = videoUrl
          ? `<a href="${videoUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs font-semibold no-underline border border-blue-600 text-blue-600 bg-blue-50 hover:bg-blue-600 hover:text-white rounded-none whitespace-nowrap flex-shrink-0 transition-colors">Ver Video</a>`
          : `<span onclick="event.stopPropagation()" class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs font-semibold border border-slate-200 text-slate-400 bg-slate-100 opacity-60 cursor-not-allowed pointer-events-none rounded-none whitespace-nowrap flex-shrink-0">Sin Video</span>`;

        html += `
          <details class="group bg-white border border-slate-200 p-7 flex flex-col w-full rounded-none">
            <summary class="flex items-center justify-between gap-4 flex-shrink-0 cursor-pointer list-none select-none border-b border-transparent group-open:border-slate-200 group-open:pb-3 transition-all [&::-webkit-details-marker]:hidden">
              <div class="flex flex-col gap-1.5 min-w-0">
                <div class="flex items-center gap-2.5">
                  <svg width="16" height="16" style="width: 16px; height: 16px;" class="w-4 h-4 text-slate-400 transition-transform duration-200 group-open:rotate-90 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path>
                  </svg>
                  ${sessionBadge}
                  ${dateSpan}
                </div>
                <h1 class="text-xl font-bold text-slate-900 m-0 leading-snug truncate pl-6 font-mono">${parseMarkdown(titleText)}</h1>
              </div>
              <div class="flex items-center gap-3 flex-shrink-0">
                ${videoBtnHtml}
              </div>
            </summary>
            <div class="pt-5">
              ${renderListItems(sessionItems)}
            </div>
          </details>
        `;
      }
      container.innerHTML = html;
    }

    // Fetch bitacora.json
    fetch('bitacora.json')
      .then(res => res.json())
      .then(data => renderCards(data))
      .catch(err => {
        console.error('Error loading bitacora.json:', err);
      });
  </script>

</body>
</html>
